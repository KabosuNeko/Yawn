<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Tab</title>
    <link rel="stylesheet" href="new_tab.css" />
  </head>

  <body>
    <main id="app">
      <!-- command bar: engine logo, input, search, engine picker -->
      <div id="bar">
        <i id="searchIcon" aria-hidden="true"></i>
        <input
          type="text"
          id="search-input"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search or enter an address"
        />
        <button
          id="search-btn"
          class="icon-btn"
          data-icon="search"
          aria-label="Search"
        ></button>
        <button id="engine-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="engine-label"></span>
          <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
        <ul id="engine-menu" role="listbox" aria-label="Search engine" hidden></ul>
      </div>

      <!-- suggestions -->
      <ul id="suggestions-list"></ul>

      <!-- favourite websites -->
      <section id="favorites-section">
        <ul id="favorites"></ul>
        <div id="add-top-site-input-container">
          <input
            type="url"
            id="add-top-site-input"
            placeholder="Add new favourite website link"
            data-action="addNewUrl"
            aria-label="Favourite website address"
          />
          <button
            id="new-top-site-btn"
            class="icon-btn"
            data-icon="plus"
            aria-label="Save favourite"
          ></button>
        </div>
      </section>
    </main>

    <!-- settings -->
    <section id="settings-container">
      <div id="settings-trigger">
        <button
          id="settings-btn"
          class="icon-btn"
          data-icon="settings"
          aria-label="Settings"
          title="Settings (alt+s)"
        ></button>
      </div>

      <aside id="settings-panel" class="hidden" aria-label="Settings">
        <h2>Settings</h2>
        <div class="separator"></div>
        <ul id="settings-options"></ul>
        <div class="separator"></div>
        <ul id="settings-search-engines"></ul>
      </aside>

      <div id="toast" class="hidden" role="status" aria-live="polite"></div>
    </section>

    <script type="module" src="new_tab.js"></script>
  </body>
</html>
