<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yawn</title>
    <link rel="stylesheet" href="new_tab.css" />
    <link rel="icon" href="./images/icon32.png" />
  </head>

  <body>
    <main id="app">
      <div id="clock-block" class="hidden">
        <time id="clock"></time>
        <time id="date"></time>
      </div>
      <div id="bar">
        <i id="searchIcon" aria-hidden="true"></i>
        <input
          type="text"
          id="search-input"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search or enter an address"
        />
        <button
          id="search-btn"
          class="icon-btn"
          data-icon="search"
          aria-label="Search"
        ></button>
        <button id="engine-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="engine-label"></span>
          <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
        <ul id="engine-menu" role="listbox" aria-label="Search engine" hidden></ul>
        <ul id="suggestions-list"></ul>
      </div>

      <section id="favorites-section">
        <ul id="favorites"></ul>
        <div id="add-top-site-input-container">
          <input
            type="url"
            id="add-top-site-input"
            placeholder="Add new favourite website link"
            data-action="addNewUrl"
            aria-label="Favourite website address"
          />
          <button
            id="new-top-site-btn"
            class="icon-btn"
            data-icon="plus"
            aria-label="Save favourite"
          ></button>
        </div>
      </section>
    </main>

    <section>
      <div id="settings-trigger">
        <button
          id="settings-btn"
          class="icon-btn"
          data-icon="settings"
          aria-label="Settings"
          title="Settings (alt+s)"
        ></button>
      </div>

      <aside id="settings-panel" class="hidden" aria-label="Settings">
        <h2>Settings</h2>
        <ul id="settings-options"></ul>
        <ul id="settings-search-engines"></ul>

        <div id="engine-add">
          <input
            type="text"
            id="engine-label-input"
            placeholder="Name"
            title="Name shown in the engine menu"
            aria-label="Search engine name"
          />
          <input
            type="text"
            id="engine-url-input"
            placeholder="Search url"
            title="The query is appended to this url, or use %s as its placeholder"
            aria-label="Search url, %s is replaced by the query"
          />
          <button
            id="engine-add-btn"
            class="icon-btn"
            data-icon="plus"
            aria-label="Add search engine"
          ></button>
        </div>

        <div class="separator"></div>
        <button id="reset-btn" type="button">Reset to defaults</button>
      </aside>

      <div id="toast" class="hidden" role="status" aria-live="polite"></div>
    </section>

    <script type="module" src="new_tab.js"></script>
  </body>
</html>
